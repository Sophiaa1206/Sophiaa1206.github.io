baseURL: "https://sophiaa1206.github.io/"
locale: zh-CN
title: "Sophia's Blog"
theme: "PaperMod"
paginate: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Sophia's Blog"
  description: "记录技术、生活与思考"
  keywords: [Blog, Portfolio, Tech]
  author: "Sophia"
  images: ["<link or path of a image for opengraph, twitter-cards>"]
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    disableHLJS: true

  label:
    text: "Sophia's Blog"
    icon: ""
    iconHeight: 35

  profileMode:
    enabled: false
    title: "Sophia's Blog"
    subtitle: "记录技术、生活与思考"
    imageUrl: ""
    imageWidth: 120
    imageHeight: 120
    imageTitle: ""
    buttons:
      - name: Posts
        url: posts
      - name: About
        url: about

  homeInfoParams:
    Title: "你好，我是 Sophia"
    Content: "欢迎来到我的博客。这里记录技术探索、学习笔记和生活感悟。"

  socialIcons:
    - name: github
      url: "https://github.com/Sophiaa1206"
    - name: email
      url: "mailto:sophia@example.com"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # Giscus 评论系统
  giscus:
    enable: true
    repo: "Sophiaa1206/Sophiaa1206.github.io"
    repoId: "R_kgDOTnVtJw"
    category: "General"
    categoryId: "DIC_kwDOTnVtJ84DCPnR"
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    theme: "preferred_color_scheme"
    lang: "zh-CN"
    loading: "lazy"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: about
      name: 关于
      url: /about/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false